databaseChangeLog:
  - changeSet:
      id: 09-add-roles-and-must-change-password-to-users
      author: mkosic
      preConditions:
        - onFail: MARK_RAN
        - not:
            columnExists:
              tableName: users
              columnName: roles
      changes:
        - addColumn:
            tableName: users
            columns:
              - column:
                  name: roles
                  type: VARCHAR(255)
              - column:
                  name: must_change_password
                  type: BOOLEAN

  - changeSet:
      id: 09-populate-and-set-not-null-roles-and-must-change-password
      author: mkosic
      changes:
        - sql:
            sql: "UPDATE users SET roles = 'ADMIN' WHERE roles IS NULL;"
        - sql:
            sql: "UPDATE users SET must_change_password = false WHERE must_change_password IS NULL;"
        - addNotNullConstraint:
            tableName: users
            columnName: roles
            columnDataType: VARCHAR(255)
            defaultNullValue: "ADMIN"
        - addNotNullConstraint:
            tableName: users
            columnName: must_change_password
            columnDataType: BOOLEAN
            defaultNullValue: "false"
